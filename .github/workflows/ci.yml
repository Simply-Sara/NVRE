name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Bevy's debug binaries link gigabytes with debuginfo, which exhausts the
  # runner's memory and crashes the linker (lld bus error). CI does not need
  # debuginfo, so turn it off rather than fight the OOM.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        # The whole tree. It is rustfmt-clean, and a crate that is left
        # unformatted is a crate the next person has to reformat.
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The editor's own tests are the slow ones — each opens the 465k-record
      # master — so they are run one at a time. In parallel they exhaust the
      # runner's memory.
      - name: Tests
        run: |
          cargo test --workspace --lib -- --test-threads=1
          cargo test --workspace --tests --no-fail-fast -- --test-threads=1
