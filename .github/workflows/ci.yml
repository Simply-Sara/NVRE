name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Bevy's debug binaries link gigabytes with debuginfo, which exhausts the
  # runner's memory and crashes the linker (lld bus error). CI does not need
  # debuginfo, so turn it off rather than fight the OOM.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    # No submodule checkout: NVForever is a git dependency, not a path one, so
    # cargo fetches it itself. The forks in crates/fnv-esm and crates/fnv-world
    # are substituted with [patch] and need nothing from the submodule.
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        # Only NVRE's own crates. crates/fnv-esm and crates/fnv-world are forks
        # kept byte-identical to upstream, so their diff against NVForever stays
        # small and reviewable; reformatting them would destroy that.
        run: cargo fmt -p nvre-edit -p nvre-editor -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `--workspace` includes the Bevy editor, whose link time dominates CI for
      # no gain; the format and edit-path crates are where the logic is.
      - name: Tests
        run: cargo test -p fnv-esm -p nvre-edit
