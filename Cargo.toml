[workspace]
resolver = "2"
members = ["crates/nvre-edit", "crates/nvre-editor", "crates/nvre-world", "crates/nvre-vfs", "crates/bsa105", "crates/ba2", "crates/nvre-util", "crates/nvre-inflate", "crates/nvre-dds", "crates/nvre-nif", "crates/nvre-esm", "crates/nvre-assets", "crates/nvre-schemas"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# NVRE's own crates, by path. These are NVRE's code, not a copy of anyone
# else's: `nvre-util` is the byte cursor, the Windows-1252 text and the
# SHA-256 that every format crate speaks, `nvre-inflate` is the zlib
# reader, and `crates/nvre-dds` is the texture reader.
nvre-util = { path = "crates/nvre-util" }
nvre-inflate = { path = "crates/nvre-inflate" }
nvre-vfs = { path = "crates/nvre-vfs" }
nvre-dds = { path = "crates/nvre-dds" }

nvre-world = { path = "crates/nvre-world" }

# The record and NIF schemas, compiled into the binary so a release build is
# one file the user can copy anywhere.
nvre-schemas = { path = "crates/nvre-schemas" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
bytes = "1.9"
tracing = "0.1"

# Editor GUI. bevy_egui 0.43 is the release that takes Bevy 0.20.
# pbr_specular_textures is what the asset layer needs (normal-map alpha as the
# specular mask). pan_orbit_camera is Bevy's own camera controller, which the
# viewport uses instead of hand-rolling an orbit camera.
bevy = { version = "=0.20.0", features = ["pbr_specular_textures", "pan_orbit_camera"] }
bevy_egui = "=0.43.0"
# egui's table widget. Since egui 0.32 `TableBuilder`/`Column` live here
# rather than in egui core, and this is the same version line as the egui
# bevy_egui pins, so the two share one egui.
egui_extras = "0.36"
# The native folder picker behind the launcher's Browse button. A blocking
# `FileDialog::pick_folder()` call: the XDG desktop portal on Linux (so the
# dialog is the desktop's own and the app needs no GTK), and the OS dialog on
# Windows and macOS. Default features are kept — `xdg-portal` is the Linux
# backend, and dropping it would leave Linux with no picker at all.
rfd = "0.15"
# Dates, in the local time zone: a file's mtime is something a person reads in
# their own zone, and `SystemTime` alone is a duration since 1970. The
# `local-offset` feature is what makes the offset resolvable at runtime.
time = { version = "0.3", features = ["local-offset"] }
clap = { version = "4", features = ["derive", "env"] }

# Enable high optimization for external dependencies in dev/debug builds.
# Makes BSA archive decompression, image decoding, and math run 8x faster in debug mode.
[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
