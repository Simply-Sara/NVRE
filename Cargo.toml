[workspace]
resolver = "2"
members = ["crates/nvre-edit", "crates/nvre-editor", "crates/nvre-world", "crates/nvre-vfs", "crates/bsa105", "crates/ba2", "crates/nvre-util", "crates/nvre-inflate", "crates/nvre-dds", "crates/nvre-nif", "crates/nvre-esm", "crates/nvre-assets"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# NVRE's own crates, by path. These are NVRE's code, not a copy of anyone
# else's: `nvre-util` is the byte cursor, the Windows-1252 text and the
# SHA-256 that every format crate speaks, `nvre-inflate` is the zlib
# reader, and `crates/nvre-dds` is the texture reader.
nvre-util = { path = "crates/nvre-util" }
nvre-inflate = { path = "crates/nvre-inflate" }
nvre-vfs = { path = "crates/nvre-vfs" }
nvre-dds = { path = "crates/nvre-dds" }

nvre-world = { path = "crates/nvre-world" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
bytes = "1.9"
tracing = "0.1"

# Editor GUI. bevy_egui 0.43 is the release that takes Bevy 0.20.
# pbr_specular_textures is what the asset layer needs (normal-map alpha as the
# specular mask).
bevy = { version = "=0.20.0", features = ["pbr_specular_textures"] }
bevy_egui = "=0.43.0"
clap = { version = "4", features = ["derive", "env"] }

# Enable high optimization for external dependencies in dev/debug builds.
# Makes BSA archive decompression, image decoding, and math run 8x faster in debug mode.
[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
