[workspace]
resolver = "2"
members = ["crates/nvre-edit", "crates/nvre-editor", "crates/fnv-world", "crates/fnv-esm", "crates/bsa105"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# NVForever's format crates, by git. The editor is read-write where those are
# read-only; upstream stays the reference implementation and moves with
# `cargo update`. Crates NVRE modifies are patched to a local fork below.
#
# `crates/fnv-world` and `crates/fnv-esm` are those forks. `fnv.schema/1`
# cannot express count-prefixed arrays, length-prefixed strings or decided
# unions, so the layouts in `schemas/` could not reach 100% coverage through
# the upstream schema language; `fnv-esm` is where those constructs now live.
# Keep each fork's diff against upstream small and documented.
fnv-util = { git = "https://github.com/LootJunkieAzza/NVForever.git" }
fnv-inflate = { git = "https://github.com/LootJunkieAzza/NVForever.git" }
fnv-esm = { git = "https://github.com/LootJunkieAzza/NVForever.git" }
fnv-vfs = { git = "https://github.com/LootJunkieAzza/NVForever.git" }
fnv-world = { git = "https://github.com/LootJunkieAzza/NVForever.git" }
# NVForever's Bevy asset layer lives in its own engine workspace, so its
# workspace-inherited deps have to be declared here too.
fnv-nif = { git = "https://github.com/LootJunkieAzza/NVForever.git" }
fnv-dds = { git = "https://github.com/LootJunkieAzza/NVForever.git" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
bytes = "1.9"
tracing = "0.1"

# Editor GUI. bevy_egui 0.42 is the newest release that still takes Bevy 0.19
# (0.43+ requires Bevy 0.20); verified to build against bevy =0.19.1.
# pbr_specular_textures is what NVForever's own engine workspace enables, and
# its nvf-assets layer needs it (normal-map alpha as the specular mask).
bevy = { version = "=0.19.1", features = ["pbr_specular_textures"] }
bevy_egui = "=0.42.0"
clap = { version = "4", features = ["derive", "env"] }

# NVRE's forks of upstream crates. Cargo substitutes these for every consumer
# in the graph, including transitive ones, so nothing else needs to change.
[patch."https://github.com/LootJunkieAzza/NVForever.git"]
fnv-world = { path = "crates/fnv-world" }
fnv-esm = { path = "crates/fnv-esm" }

# Enable high optimization for external dependencies in dev/debug builds.
# Makes BSA archive decompression, image decoding, and math run 8x faster in debug mode.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
