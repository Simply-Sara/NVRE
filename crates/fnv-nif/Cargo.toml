[package]
name = "fnv-nif"
description = "Gamebryo NIF/KF reader with schema-as-data block decoding, owned by NVRE for multi-game support"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# NVRE's fork of upstream's fnv-nif. Upstream stays the reference
# implementation; this copy exists so the *schema language* can express what
# several games need, which upstream's `fnv.nif.schema/1` cannot:
#
#   - layered loading (base -> family -> version), so a game directory may
#     redefine a block instead of colliding with the base's;
#   - a block redefinition replaces the whole block, so a version layer cannot
#     silently lose the base's fields;
#   - the count-prefixed array, length-prefixed string and peek-decided union
#     that the record schemas already needed.
#
# Keep the diff against upstream small and documented. Diff before every
# upstream pull.

[dependencies]
# By git, not path: a path dep here would resolve `fnv-util` to a *second*
# copy distinct from the one the rest of the graph uses.
nvre-util = { path = "../nvre-util" }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
proptest = "1"

[dev-dependencies.fnv-bsa]
path = "../../NVForever/crates/fnv-bsa"

[dev-dependencies.fnv-dds]
path = "../../NVForever/crates/fnv-dds"
