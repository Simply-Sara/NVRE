[package]
name = "nvre-editor"
description = "New Vegas Rust Editor: a GECK-like editor for Fallout: New Vegas, in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nvre_editor"
path = "src/lib.rs"

[[bin]]
name = "nvre-editor"
path = "src/main.rs"

[dependencies]
nvre-edit = { path = "../nvre-edit" }
nvre-util.workspace = true
nvre-esm = { path = "../nvre-esm" }
nvre-inflate.workspace = true
nvre-vfs.workspace = true
nvre-world.workspace = true
nvre-assets = { path = "../nvre-assets" }
nvre-schemas = { path = "../nvre-schemas" }
bsa105 = { path = "../bsa105" }
nvre-nif = { path = "../nvre-nif" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
bevy.workspace = true
bevy_egui.workspace = true
egui_extras.workspace = true
# The launcher's Browse button: the OS's own folder picker.
rfd.workspace = true
time.workspace = true
clap.workspace = true
egui_tiles = "0.17.1"

[dev-dependencies]
# The test that checks the compiled-in schemas are the ones on disk reads the
# embedded layers directly.
nvre-schemas = { path = "../nvre-schemas" }
