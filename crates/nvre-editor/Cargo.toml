[package]
name = "nvre-editor"
description = "New Vegas Rust Editor: a GECK-like editor for Fallout: New Vegas, in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nvre_editor"
path = "src/lib.rs"

[[bin]]
name = "nvre-editor"
path = "src/main.rs"

[dependencies]
nvre-edit = { path = "../nvre-edit" }
nvre-util.workspace = true
nvre-esm = { path = "../nvre-esm" }
nvre-vfs.workspace = true
nvre-world.workspace = true
nvre-assets = { path = "../nvre-assets" }
bsa105 = { path = "../bsa105" }
nvre-nif = { path = "../nvre-nif" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
bevy.workspace = true
bevy_egui.workspace = true
clap.workspace = true
egui_tiles = "0.17.1"
