[package]
name = "nvre-vfs"
description = "Read-only virtual file system over BSA archives and loose files"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# NVRE's own archive reader, which handles both version 104 (Fallout, Skyrim's
# original edition) and version 105 (Skyrim's Special Edition) in one crate.
bsa105 = { path = "../bsa105" }
# Fallout 4's and 76's archives are a different format entirely; the reader is
# chosen by the file's magic, so a game whose archives are BA2 needs nothing
# from the caller.
ba2 = { path = "../ba2" }
# Fallout 4 precombined shared geometry (.csg) companion archives.
csg = { path = "../csg" }
thiserror.workspace = true

[dev-dependencies]
# Writes a canonical v104 BSA, so the precedence tests can put real contents
# in two archives and assert which one is read.
bsa105 = { path = "../bsa105" }
# The NIF reader, for the `nifreencode` checker: the parity plan's S1-1
# measurement runs over a whole game's meshes, and it belongs in a crate that
# builds in seconds rather than one that pulls in Bevy.
nvre-nif = { path = "../nvre-nif" }
# The corpus checks are per-file and independent, so they run in parallel:
# a whole game's meshes is 20k-225k files and one core at a time is the
# difference between a minute and half an hour.
rayon = "1"
